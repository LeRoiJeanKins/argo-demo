apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-site-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mon-site
  template:
    metadata:
      labels:
        app: mon-site
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mon-site-svc
spec:
  selector:
    app: mon-site
  ports:
  - port: 80
    targetPort: 80
