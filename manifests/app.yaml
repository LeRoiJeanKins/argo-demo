apiVersion: v1
kind: ConfigMap
metadata:
  name: page-web-html
data:
  index.html: |
    <html>
      <body style="background-color: #FFFFFF; color: white; font-family: sans-serif; text-align: center; padding-top: 100px;">
        <h1>VERSION 1 : Site en ligne !</h1>
        <p>Deployee automatiquement par Argo CD</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-site-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-site
  template:
    metadata:
      labels:
        app: mon-site
      annotations:
        version: "v1"
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: page-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: mon-site-svc
spec:
  selector:
    app: mon-site
  ports:
  - port: 80
    targetPort: 80
